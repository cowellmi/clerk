# Builds the server image (Dockerfile) on each push to main, which arrives here
# through the git host's mirror, and pushes ghcr.io/cowellmi/clerk:<sha> and :main.
# The git host's deploy hook waits for <sha> and swaps it in.
name: image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cowellmi/clerk:${{ github.sha }}
            ghcr.io/cowellmi/clerk:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
